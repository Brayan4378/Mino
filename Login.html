<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Mino</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script src="js/tema.js"></script>
</head>

<body class="login">
    <main class="registro-contenedor">
        <a class="registro-marca" href="Menu.html" aria-label="Mino, ir al inicio">
            <img src="Imagenes/logo.png" alt="">
            <span>Mino</span>
        </a>

        <form class="registro-formulario" autocomplete="on">
            <header class="registro-encabezado">
                <p class="registro-etiqueta">QUÉ BUENO VERTE</p>
                <h1>Iniciar sesión</h1>
                <p>Entra para seguir en contacto con tu comunidad.</p>
            </header>

            <div class="registro-campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" autocomplete="email"
                    placeholder="tu@correo.com" required>
            </div>

            <div class="registro-campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password"
                    autocomplete="current-password" placeholder="Tu contraseña" required>
            </div>

            <p id="estadoLogin" role="status" aria-live="polite"></p>
            <button class="registro-boton" type="submit">Iniciar sesión</button>
            <p class="registro-iniciar">¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>
        </form>
    </main>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
