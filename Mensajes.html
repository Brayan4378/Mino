<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes | Mino</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script src="js/tema.js"></script>
</head>

<body>
    <ul id="menu">
        <li id="logo-li"><a href="Menu.html"><img src="Imagenes/logo_transparent.png" alt="Logo Mino">Mino</a></li>
        <li><a href="Mensajes.html" aria-current="page"><img src="Imagenes/sobre.png" alt="Mensajes">Mensajes</a></li>
        <li><a href="Buscar.html"><img src="Imagenes/busqueda.png" alt="Buscar">Buscar</a></li>
        <li><a href="Subir.html"><img src="Imagenes/subir.png" alt="Subir">Subir</a></li>
        <li><a href="Perfil.html"><img src="Imagenes/usuario.png" alt="Perfil">Perfil</a></li>
        <li><a href="Configuracion.html"><img src="Imagenes/controles.png" alt="Configuración">Configuración</a></li>
    </ul>

    <main id="mensajes-container">
        <aside id="mensajes-lista" aria-label="Conversaciones">
            <header class="mensajes-lista-encabezado">
                <div>
                    <p class="mensajes-etiqueta">TU ESPACIO PRIVADO</p>
                    <h1>Mensajes</h1>
                </div>
                <a class="mensajes-nuevo" href="#formularioBuscarContacto"
                    aria-label="Iniciar una conversación">+</a>
            </header>

            <form id="formularioBuscarContacto" class="mensajes-buscar" role="search">
                <label for="buscarContacto">Iniciar conversación</label>
                <div class="mensajes-buscar-campo">
                    <input id="buscarContacto" type="search" maxlength="80"
                        placeholder="Buscar personas..." autocomplete="off">
                    <button type="submit">Buscar</button>
                </div>
            </form>
            <p id="estadoBuscarContacto" class="mensajes-estado" role="status" aria-live="polite"></p>
            <div id="resultadosContactos" class="mensajes-resultados"></div>

            <h2 class="mensajes-subtitulo">Conversaciones</h2>
            <p id="estadoConversaciones" class="mensajes-estado" role="status" aria-live="polite"></p>
            <div id="listaConversaciones" class="mensajes-conversaciones"></div>
        </aside>

        <section id="mensajes-chat" aria-label="Chat">
            <div id="mensajes-vacio">
                <div id="mensajes-icono-circulo">
                    <img src="Imagenes/sobre.png" alt="">
                </div>
                <h2>Tu bandeja de mensajes</h2>
                <p>Busca a alguien para iniciar una conversación privada.</p>
                <button id="botonBuscarContacto" type="button">Buscar personas</button>
            </div>

            <section id="conversacionActiva" class="conversacion-activa" hidden>
                <header class="conversacion-encabezado">
                    <button id="volverConversaciones" class="conversacion-volver" type="button"
                        aria-label="Volver a conversaciones">‹</button>
                    <span id="avatarConversacion" class="conversacion-avatar" aria-hidden="true"></span>
                    <div class="conversacion-contacto">
                        <h2 id="nombreConversacion"></h2>
                        <span>Conversación privada</span>
                    </div>
                    <a id="verPerfilConversacion" class="conversacion-ver-perfil" href="#">Ver perfil</a>
                </header>

                <div class="conversacion-cuerpo">
                    <button id="cargarMensajesAnteriores" class="mensajes-anteriores" type="button" hidden>
                        Cargar mensajes anteriores
                    </button>
                    <p id="estadoMensajes" class="mensajes-estado" role="status" aria-live="polite"></p>
                    <div id="listaMensajes" class="lista-mensajes" aria-live="polite"></div>
                </div>

                <form id="formularioEnviarMensaje" class="compositor-mensaje">
                    <label class="solo-lectores" for="entradaMensaje">Escribe un mensaje</label>
                    <textarea id="entradaMensaje" name="contenido" rows="1" maxlength="2000"
                        placeholder="Escribe un mensaje..." required></textarea>
                    <button type="submit" aria-label="Enviar mensaje">Enviar</button>
                </form>
                <p id="estadoEnviarMensaje" class="mensajes-estado" role="status" aria-live="polite"></p>
            </section>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/mensajes.js"></script>
</body>

</html>
