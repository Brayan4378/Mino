<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mino</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <script src="js/tema.js"></script>
    <script src="js/Configuracion.js"></script>

</head>

<body>
    <ul id="menu">
        <li id="logo-li"><a href="Menu.html"><img id="logo" src="/Imagenes/logo_transparent.png"
                    alt="Logo Mino">Mino</a></li>
        <li><a href="Mensajes.html"><img src="/Imagenes/sobre.png" alt="Logo Mensajes">Mensajes</a></li>
        <li><a href="Buscar.html"><img src="/Imagenes/busqueda.png" alt="Logo Buscar">Buscar</a></li>
        <li><a href="Subir.html"><img src="/Imagenes/subir.png" alt="Logo Subir">Subir</a></li>
        <li><a href="Perfil.html"><img src="/Imagenes/usuario.png" alt="Logo Perfil">Perfil</a></li>
        <li><a href="Configuracion.html"><img src="/Imagenes/controles.png" alt="Logo Configuración">Configuración</a>
        </li>
    </ul>

    <div id="opciones">
        <h2 class="subti">Configuración</h2><br><br>
        <ul class="lista-opciones">
            <li>
                <span>Modo oscuro</span>
                <input type="checkbox" id="modoOscuro" checked>
            </li>
            <li>
                <span>Idioma</span>
                <select id="idioma">
                    <option value="es">Español</option>
                    <option value="en">English</option>
                    <option value="pt">Português</option>
                </select>
            </li>
            <li>
                <span>Notificaciones</span>
                <input type="checkbox" id="notificaciones" checked>
            </li>
            <li>
                <span>Cuenta privada</span>
                <input type="checkbox" id="cuentaPrivada">
            </li>
            <li>
                <button id="cambiarContra">Cambiar contraseña</button>
            </li>
            <li>
                <button id="ayuda">Ayuda y soporte</button>
            </li>
            <li>
                <button id="cerrarSesion">Cerrar sesión</button>
            </li>

        </ul>
    </div>

    <div id="modalContrasena" class="modal">
        <div class="contenidoModal">
            <button class="cerrar" id="cerrarModalContrasena" type="button">&times;</button>
            <h2>Confirmar contraseña</h2>
            <p>Escribe una contraseña simulada para continuar.</p>
            <form id="formularioContrasena">
                <label for="contrasenaSimulada">Contraseña</label>
                <input type="password" id="contrasenaSimulada" required>
                <div class="accionesModal">
                    <button type="submit">Aceptar</button>
                    <button id="cancelarModalContrasena" type="button">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalCerrarSesion" class="modal">
        <div class="contenidoModal">
            <button class="cerrar" id="cerrarModalSesion" type="button">&times;</button>
            <h2>Cerrar sesión</h2>
            <p>¿Estás seguro de que quieres cerrar sesión?</p>
            <div class="accionesModal">
                <button id="confirmarCerrarSesion" type="button">Sí, cerrar sesión</button>
                <button id="cancelarCerrarSesion" type="button">Cancelar</button>
            </div>
        </div>
    </div>

</body>

</html>
